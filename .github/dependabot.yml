# Dependabot: a pull request when a Composer dependency has a new version.
#
# Since 1.7.0 this is THE way the bundled dependencies change: sites no longer
# update anything themselves, so SCF, ASE, The SEO Framework, Timber, Twig and the Symfony
# polyfills move only through a pull request here, tested and released by the
# developer. (The MCP Adapter isn't on Packagist; see
# .github/workflows/mcp-adapter-release.yml.)
#
# A Dependabot PR edits composer.json/composer.lock only. vendor/ is committed
# and is what a tag ships, so merging the PR alone changes nothing on sites,
# and bin/check-vendor-drift.sh (run by bin/release.sh) refuses to release
# until vendor/ matches the lock again. .github/workflows/dependabot-vendor.yml
# does that step on the PR itself (composer install, commit vendor/ to the PR
# branch, re-run the checks), so a PR is merge-ready once its checks are green.
# By hand, if it ever has to be:
#     git pull && composer install && php tests/vendor/bin/phpunit
#     git add vendor composer.lock && git commit
# Dependabot won't update a PR someone has pushed to, which includes that
# workflow's commit: `@dependabot recreate` rebuilds it (and re-runs the sync).
#
# SCF and ASE are exact pins ("6.9.7"); Dependabot moves the pin, which is
# the intent: a newer version is offered, never a range that drifts.
#
# .github/ is export-ignored, so none of this reaches a site.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "Dependencies"

  # The plugins installed into wp-content/plugins/ (WooCommerce, and WPvivid Backup,
  # which the theme installs only while a site's Brand Relay plan includes backups).
  # Same rule as above: an exact pin, moved by a pull request, shipped only in a
  # release. Each plugin gets its own pull request.
  # The PR edits composer.json/lock only; the zip a release ships is built from
  # the lock by bin/bundle-plugins.sh (dependabot-vendor.yml runs it on the PR).
  - package-ecosystem: "composer"
    directory: "/bundled-plugins"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "Dependencies"

  # Test tooling (PHPUnit, wp-phpunit, polyfills). Never shipped; monthly.
  - package-ecosystem: "composer"
    directory: "/tests"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 50
    groups:
      test-tooling:
        patterns:
          - "*"
    commit-message:
      prefix: "Test tooling"
